<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahula College | English Media Unit</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #ec4899;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 100%);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
            position: relative;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.18;
        }
        body::before {
            top: -120px;
            left: -120px;
            background: var(--primary);
        }
        body::after {
            bottom: -120px;
            right: -120px;
            background: var(--accent);
        }

        .view {
            display: none;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .view.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .landing-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            padding: 4.5rem 3rem;
            text-align: center;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
            width: 100%;
        }

        .landing-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        .landing-card h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8 0%, #f472b6 50%, #fb7185 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        .landing-card p {
            color: var(--text-muted);
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 2.5rem;
        }

        .enter-btn {
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            color: #fff;
            border: none;
            padding: 1.1rem 3.5rem;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(99, 102, 241, 0.45);
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
        }

        .enter-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 45px rgba(236, 72, 153, 0.6);
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h2 {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8 0%, #f472b6 50%, #fb7185 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            padding: 3.5rem 3rem;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
            position: relative;
            width: 100%;
        }

        .card-badge {
            position: absolute;
            top: 2.2rem;
            right: 2.2rem;
            background: linear-gradient(135deg, var(--accent), #db2777);
            color: #fff;
            padding: 0.55rem 1.35rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.45);
            animation: bounce 2s infinite;
        }

        .card h3 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .date-sub {
            color: var(--text-muted);
            font-size: 1.15rem;
            margin-bottom: 2.5rem;
            font-weight: 600;
        }

        .slot-list {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        .slot-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.5rem 1.8rem;
            border-radius: 22px;
            transition: all 0.3s ease;
            position: relative;
        }

        .slot-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 0;
            background: var(--primary);
            border-radius: 0 4px 4px 0;
            transition: height 0.3s ease;
        }

        .slot-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(129, 140, 248, 0.4);
            transform: translateX(6px);
        }

        .slot-item:hover::before {
            height: 65%;
        }

        .slot-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #818cf8;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .slot-names {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.5;
        }

        .slot-grade {
            font-size: 0.9rem;
            color: #cbd5e1;
            font-weight: 600;
            background: rgba(99, 102, 241, 0.25);
            border: 1px solid rgba(99, 102, 241, 0.35);
            padding: 0.25rem 0.75rem;
            border-radius: 8px;
            margin-left: 0.7rem;
            display: inline-block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

    <!-- LANDING VIEW -->
    <div id="landing-view" class="view active">
        <div class="landing-card">
            <div class="landing-icon">🎙️</div>
            <h1>Rahula College</h1>
            <p>English Media Unit • Live Broadcast Roster Portal (v6.0)</p>
            <button class="enter-btn" onclick="enterDashboard()">Enter Portal ✨</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD VIEW -->
    <div id="dashboard-view" class="view">
        <div class="container" style="width: 100%;">
            <header>
                <h2>Rahula College</h2>
                <p>English Media Unit • Live Broadcast Loop (v6.0)</p>
            </header>

            <div class="card">
                <div class="card-badge">Next Upcoming Broadcast</div>
                <h3 id="session-title">📅 Initializing...</h3>
                <div class="date-sub" id="session-date">--</div>
                <div class="slot-list" id="session-slots"></div>
            </div>
        </div>
    </div>

    <script>
        const manualOverrides = {};

        // Verified Student Pools with exact class tags
        const pool = {
            g6_prog: [
                { name: "M. Senula Lohas", class: "6-C" },
                { name: "B.U. Lendu Denuwan", class: "6-G" },
                { name: "Lasindu Denuwan", class: "6-G" },
                { name: "H T Sawen Randull Yometh", class: "6-G" },
                { name: "Newch Vilupa Rutasinghe", class: "6-G" },
                { name: "Lathita Hasath Rathiniryaka", class: "6-G" },
                { name: "Gesandu Nimsuka", class: "8-D" },
                { name: "Sehas Dinharu Wijerathna", class: "6-G" },
                { name: "H.K. Yahan Bas", class: "6-H" },
                { name: "Erandi Kannangara", class: "7-H" },
                { name: "Kaweesh Snehin Runage", class: "7-G" },
                { name: "Rashil Nandinu Wickramasinghe de", class: "6-G" },
                { name: "Desindu Ronal Amarasi Guna", class: "6-G" },
                { name: "Sehinsa Chettuhas Kankanam Pathi", class: "6-H" },
                { name: "Gan Hewage Mihuja Sasdimu Wickh", class: "6-G" },
                { name: "EDIRISINHE ARACHCHIGE INDUN", class: "7-H" }
            ],
            g7_prog: [
                { name: "P. A. Menupa Thinath Randira", class: "7-G" },
                { name: "P.M. Ham Sandul", class: "9-H" },
                { name: "Hesandu Sasith Godawelage", class: "7-G" },
                { name: "P.G Masendu Sethruta", class: "7-H" },
                { name: "K.A. Sanuth Nethmira Hettiarachvi", class: "7-G" },
                { name: "S.Sanuth Dumith Samarasingha", class: "7-H" },
                { name: "A.G.A.T Nimaada", class: "7-G" },
                { name: "Hithesina Nirmith Wickramaratne", class: "6-G" },
                { name: "Ometh Cheriru Sedarshetti", class: "7-G" },
                { name: "Induwara Udan", class: "7-H" }
            ],
            g8_prog: [
                { name: "Tharul Damnada Gunasekara", class: "8-I" },
                { name: "INAL SANISHTHA HEWAVIDANA", class: "8-I" },
                { name: "Hasat Dinadith Perera", class: "8-I" },
                { name: "Janiru Ninduwara Weragoda Arachchi", class: "8-I" },
                { name: "Vidana Gamage Sinura Sasvidu", class: "8-I" },
                { name: "KH. Chathum Dinethh", class: "8-H" },
                { name: "Setath Abayasinghe", class: "8-H" },
                { name: "Isath Arshana Wickramasinghe", class: "8-I" }
            ],
            g9_prog: [
                { name: "Sethindu Dissanayake", class: "9-G" },
                { name: "Shanuka Seygan Adithya Bandara", class: "9-H" },
                { name: "Sedul Dimara Kodithuwakku", class: "9-I" },
                { name: "S.T.M Dissanayake", class: "9-G" },
                { name: "A.G.Shashidu Ashish", class: "9-G" },
                { name: "Damsara Neththikumara", class: "9-I" },
                { name: "Chaniru Ranmeth", class: "9-H" }
            ],
            g9_news: [
                { name: "Sethindu Dissanayake", class: "9-G" },
                { name: "Shanuka Seygan Adithya Bandara", class: "9-H" },
                { name: "Sedul Dimara Kodithuwakku", class: "9-I" },
                { name: "S.T.M Dissanayake", class: "9-G" },
                { name: "A.G.Shashidu Ashish", class: "9-G" },
                { name: "Damsara Neththikumara", class: "9-I" },
                { name: "Chaniru Ranmeth", class: "9-H" }
            ],
            g10_prog: [
                { name: "Isija Anusara", class: "10-B" },
                { name: "Yasiru Sithijaya Ranasinghe", class: "10-C" },
                { name: "Disinu Chandul", class: "10-H" },
                { name: "Danindu", class: "10-H" }
            ],
            g10_news: [
                { name: "Isija Anusara", class: "10-B" },
                { name: "Yasiru Sithijaya Ranasinghe", class: "10-C" },
                { name: "Disinu Chandul", class: "10-H" },
                { name: "Danindu", class: "10-H" }
            ]
        };

        function resolveAndAdvance(type, grade, counters) {
            let poolKey = '';
            if (type === 'qotd') {
                poolKey = (grade === 6) ? 'g6_prog' : 'g7_prog';
            } else if (type === 'spec') {
                poolKey = (grade === 8) ? 'g8_prog' : 'g9_prog';
            } else if (type === 'song') {
                if (grade === 8) poolKey = 'g8_prog';
                else if (grade === 9) poolKey = 'g9_prog';
                else if (grade === 10) poolKey = 'g10_prog';
            } else if (type === 'news') {
                if (grade === 9) poolKey = 'g9_news';
                else if (grade === 10) poolKey = 'g10_news';
            }

            let list = pool[poolKey] || pool.g6_prog;
            let currentIdx = counters[poolKey];

            const idx1 = currentIdx % list.length;
            let idx2 = (currentIdx + 1) % list.length;
            if (list.length > 1 && idx1 === idx2) {
                idx2 = (idx2 + 1) % list.length;
            }
            const pair = list.length < 2 ? [list[0], list[0]] : [list[idx1], list[idx2]];

            // Strict jump by 2 so crew members never overlap and pools fully exhaust before cycling
            counters[poolKey] = (currentIdx + 2) % list.length;

            const student1Text = `${pair[0].name} <span style="font-size:0.85rem; color:#818cf8; font-weight:600;">(${pair[0].class})</span>`;
            const student2Text = `${pair[1].name} <span style="font-size:0.85rem; color:#818cf8; font-weight:600;">(${pair[1].class})</span>`;

            return { names: `${student1Text} & ${student2Text}`, gradeText: `Grade ${grade}` };
        }

        function generateScheduleDays() {
            let days = [];
            let curr = new Date(2026, 9, 16, 7, 50, 0);

            let counters = {
                g6_prog: 0,
                g7_prog: 0,
                g8_prog: 0,
                g9_prog: 0,
                g9_news: 0,
                g10_prog: 0,
                g10_news: 0
            };

            for (let i = 0; i < 150; i++) {
                let dayOfWeek = curr.getDay();
                let year = curr.getFullYear();
                let month = String(curr.getMonth() + 1).padStart(2, '0');
                let day = String(curr.getDate()).padStart(2, '0');
                let dateStr = `${year}-${month}-${day}`;
                let formattedDate = curr.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });

                if (dayOfWeek === 5) { // FRIDAY
                    let qotdGrade = (i % 2 === 0) ? 6 : 7;
                    let specGrade = (i % 2 === 0) ? 8 : 9;
                    let newsGrade = (i % 2 === 0) ? 10 : 9;

                    let qotdData = resolveAndAdvance('qotd', qotdGrade, counters);
                    let specData = resolveAndAdvance('spec', specGrade, counters);
                    
                    if (specGrade === newsGrade) {
                        counters['g9_news'] = (counters['g9_news'] + 2) % pool['g9_news'].length;
                    }
                    let newsData = resolveAndAdvance('news', newsGrade, counters);

                    days.push({
                        dateKey: dateStr,
                        displayDate: formattedDate,
                        dayType: 'Friday',
                        slots: [
                            { title: "Quote of the Day", names: qotdData.names, gradeText: qotdData.gradeText },
                            { title: "Speciality of the Day", names: specData.names, gradeText: specData.gradeText },
                            { title: "Rahal News Programme", names: newsData.names, gradeText: newsData.gradeText }
                        ]
                    });
                } else if (dayOfWeek === 3) { // WEDNESDAY
                    let qotdGrade = (i % 2 === 0) ? 6 : 7;
                    let specGrade = (i % 2 === 0) ? 8 : 9;
                    let songGrade = (i % 3 === 0) ? 8 : (i % 3 === 1) ? 9 : 10;

                    let qotdData = resolveAndAdvance('qotd', qotdGrade, counters);
                    
                    if (qotdGrade === specGrade) {
                        let k = specGrade === 8 ? 'g8_prog' : 'g9_prog';
                        counters[k] = (counters[k] + 2) % pool[k].length;
                    }
                    let specData = resolveAndAdvance('spec', specGrade, counters);

                    if (specGrade === songGrade) {
                        let songPoolKey = songGrade === 8 ? 'g8_prog' : songGrade === 9 ? 'g9_prog' : 'g10_prog';
                        counters[songPoolKey] = (counters[songPoolKey] + 2) % pool[songPoolKey].length;
                    }
                    let songData = resolveAndAdvance('song', songGrade, counters);

                    days.push({
                        dateKey: dateStr,
                        displayDate: formattedDate,
                        dayType: 'Wednesday',
                        slots: [
                            { title: "Quote of the Day", names: qotdData.names, gradeText: qotdData.gradeText },
                            { title: "Speciality of the Day", names: specData.names, gradeText: specData.gradeText },
                            { title: "A Song for Your Life", names: songData.names, gradeText: songData.gradeText }
                        ]
                    });
                }

                if (dayOfWeek === 5) {
                    curr.setDate(curr.getDate() + 5);
                } else {
                    curr.setDate(curr.getDate() + 2);
                }
            }
            return days;
        }

        function buildSessionContent(session) {
            let html = '';
            session.slots.forEach(slot => {
                html += `<div class="slot-item"><div class="slot-title">${slot.title}</div><div class="slot-names">${slot.names}<span class="slot-grade">${slot.gradeText}</span></div></div>`;
            });
            return html;
        }

        function updateDisplay() {
            const schedule = generateScheduleDays();
            const now = new Date();

            let activeIndex = 0;
            for (let i = 0; i < schedule.length; i++) {
                let sessionDateStr = schedule[i].dateKey;
                let cutoffTime = new Date(sessionDateStr + "T07:50:00");
                let endOfDay = new Date(sessionDateStr + "T23:59:59");

                if (now < cutoffTime) {
                    activeIndex = i;
                    break;
                }
                if (now >= cutoffTime && now <= endOfDay) {
                    activeIndex = i + 1;
                    break;
                }
                if (now > endOfDay) {
                    activeIndex = i + 1;
                }
            }

            if (activeIndex >= schedule.length) activeIndex = schedule.length - 1;

            const targetSession = schedule[activeIndex];
            document.getElementById('session-title').innerHTML = `🌟 ${targetSession.dayType} Broadcast`;
            document.getElementById('session-date').innerText = targetSession.displayDate;
            document.getElementById('session-slots').innerHTML = buildSessionContent(targetSession);
        }

        function enterDashboard() {
            document.getElementById('landing-view').classList.remove('active');
            document.getElementById('dashboard-view').classList.add('active');
            updateDisplay();
        }

        updateDisplay();
        setInterval(updateDisplay, 10000);
    </script>
</body>
</html>
